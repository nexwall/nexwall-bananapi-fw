# MediaTek Filogic (MT7981, MT7986, MT7987, MT7988; aarch64). One package set (aarch64_cortex-a53) for every board; the
# board is chosen by PROFILE (config/profiles/). Full profile, antivirus included.
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_BOARD="mediatek"
CONFIG_TARGET_SUBTARGET="filogic"
CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"

# Licensed core, web protection, DPI plugins and the Snort gate are vendor binaries pinned for aarch64 (nexwall-bananapi-private-notes/TRACKER.md).
# CONFIG_NEXWALL_NETIFY_PLUGINS_VENDOR is not set
CONFIG_NEXWALL_SNORT_PLUGINS_VENDOR=y

# Antivirus engines (ClamAV, freshclam, YARA) are part of the image: verified to run with 2 GB of RAM (owner, 2026-11-09).
# They come from the upstream config (clamav.conf, yara.conf) and CONFIG_NEXWALL_WEBPROTECTION_AV (default y).
CONFIG_NEXWALL_WEBPROTECTION_AV=y

# Data disk (ns-storage, /mnt/data): NVMe M.2 on the boards that have the slot, USB disks as a fallback. The x86 image gets these
# from its target defaults; Filogic does not, and ns-storage needs ext4 (mkfs.ext4, mount) and parted on a second disk.
CONFIG_PACKAGE_kmod-nvme=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-scsi-core=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-usb-storage-uas=y
CONFIG_PACKAGE_nvme-cli=y
CONFIG_PACKAGE_blkid=y
CONFIG_PACKAGE_e2fsprogs=y
CONFIG_PACKAGE_tune2fs=y
CONFIG_PACKAGE_parted=y
CONFIG_PACKAGE_smartmontools=y

# The Banana Pi sdcard.img.gz artifact appends the recovery initramfs and checks it fits in 32 MiB (12M..44M); the full firewall
# rootfs is ~80 MB, so no initramfs image is built. Recovery is by NOR/NAND/SD reflash, not by an initramfs.
CONFIG_TARGET_ROOTFS_INITRAMFS=n
